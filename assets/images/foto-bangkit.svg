<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="300" rx="16" fill="#141414"/>
  <rect x="0.5" y="0.5" width="299" height="299" rx="15.5" stroke="rgba(255,255,255,0.12)"/>
  
  <!-- Subtle tech grid background -->
  <circle cx="150" cy="120" r="70" fill="rgba(66, 133, 244, 0.08)" filter="blur(20px)"/>
  <circle cx="180" cy="140" r="50" fill="rgba(139, 226, 60, 0.08)" filter="blur(20px)"/>

  <!-- Cloud outline icon -->
  <g transform="translate(85, 60)">
    <!-- Cloud shape -->
    <path d="M102 65C118.569 65 132 51.5685 132 35C132 19.3871 120.087 6.55997 104.894 5.1118C99.8242 -2.14659 90.8716 -6 80 -6C65.5 -6 53.5 3 49 14C44 11 38 9 31 9C13.8792 9 0 22.8792 0 40C0 57.1208 13.8792 71 31 71L102 71C102 69 102 67 102 65Z" fill="url(#cloudGrad)" opacity="0.95"/>
    <!-- Tech nodes inside cloud -->
    <circle cx="45" cy="42" r="5" fill="#4285F4"/>
    <circle cx="75" cy="30" r="5" fill="#EA4335"/>
    <circle cx="95" cy="45" r="5" fill="#FBBC05"/>
    <circle cx="65" cy="52" r="5" fill="#34A853"/>
    <path d="M45 42L75 30M75 30L95 45M75 30L65 52M45 42L65 52" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="2 2" opacity="0.7"/>
  </g>

  <!-- Bangkit Text & Badge -->
  <text x="150" y="195" font-family="'Poppins', sans-serif" font-weight="700" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">bangK!t</text>
  <text x="150" y="218" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#8BE23C" text-anchor="middle" letter-spacing="1.5">GOOGLE CLOUD</text>
  <text x="150" y="238" font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#8A8A8A" text-anchor="middle">by Google, GoTo, Traveloka</text>

  <!-- 4 Google dots at bottom -->
  <circle cx="120" cy="262" r="3.5" fill="#4285F4"/>
  <circle cx="140" cy="262" r="3.5" fill="#EA4335"/>
  <circle cx="160" cy="262" r="3.5" fill="#FBBC05"/>
  <circle cx="180" cy="262" r="3.5" fill="#34A853"/>

  <defs>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="132" y2="71" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A2744"/>
      <stop offset="1" stop-color="#0E1A2B"/>
    </linearGradient>
  </defs>
</svg>